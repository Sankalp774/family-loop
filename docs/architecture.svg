<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-label="Family Loop architecture">
  <rect width="1100" height="620" fill="#f3eadc"/>
  <text x="40" y="42" font-family="Georgia, serif" font-size="22" fill="#241c16">Family Loop — OS enforcement vs our inbox</text>
  <text x="40" y="68" font-family="Verdana, sans-serif" font-size="13" fill="#9b1c1c">We do not control the device.</text>

  <g font-family="Verdana, sans-serif" font-size="13" fill="#241c16">
    <rect x="40" y="100" width="160" height="70" fill="#1f4d4a"/>
    <text x="120" y="132" text-anchor="middle" fill="#f3eadc">Parent door</text>
    <text x="120" y="152" text-anchor="middle" fill="#f3eadc" font-size="11">Meera</text>

    <rect x="40" y="190" width="160" height="70" fill="#c45c26"/>
    <text x="120" y="222" text-anchor="middle" fill="#f3eadc">Child door</text>
    <text x="120" y="242" text-anchor="middle" fill="#f3eadc" font-size="11">Aarav</text>

    <rect x="40" y="300" width="160" height="70" fill="#241c16"/>
    <text x="120" y="332" text-anchor="middle" fill="#f3eadc">Phone OS</text>
    <text x="120" y="352" text-anchor="middle" fill="#f3eadc" font-size="11">Screen Time lock</text>
  </g>

  <path d="M200 135 H260" stroke="#241c16" stroke-width="2"/>
  <path d="M200 225 H260" stroke="#241c16" stroke-width="2"/>
  <path d="M120 370 V410 H260" stroke="#9b1c1c" stroke-width="2" stroke-dasharray="6 4"/>

  <rect x="260" y="110" width="180" height="130" fill="#efe4d2" stroke="#d7c7b0"/>
  <text x="350" y="145" text-anchor="middle" font-family="Verdana" font-size="14">FastAPI desk</text>
  <text x="350" y="168" text-anchor="middle" font-family="Verdana" font-size="11" fill="#6b5748">auth · JSON store</text>
  <text x="350" y="188" text-anchor="middle" font-family="Verdana" font-size="11" fill="#6b5748">demo clock / cron</text>
  <text x="350" y="214" text-anchor="middle" font-family="Verdana" font-size="11">/api/digest · /api/ping</text>

  <path d="M440 175 H500" stroke="#241c16" stroke-width="2"/>

  <rect x="500" y="90" width="240" height="170" fill="#1f4d4a"/>
  <text x="620" y="125" text-anchor="middle" fill="#f3eadc" font-family="Georgia" font-size="16">Strands orchestrator</text>
  <text x="620" y="148" text-anchor="middle" fill="#f3eadc" font-family="Verdana" font-size="11">family_desk · agents as tools</text>
  <text x="620" y="178" text-anchor="middle" fill="#f3eadc" font-family="Verdana" font-size="11">setup_coach</text>
  <text x="620" y="198" text-anchor="middle" fill="#f3eadc" font-family="Verdana" font-size="11">request_triage</text>
  <text x="620" y="218" text-anchor="middle" fill="#f3eadc" font-family="Verdana" font-size="11">checkin_runner</text>
  <text x="620" y="238" text-anchor="middle" fill="#f3eadc" font-family="Verdana" font-size="11">digest_writer · override_clerk</text>

  <path d="M740 175 H800" stroke="#241c16" stroke-width="2"/>

  <rect x="800" y="90" width="260" height="80" fill="#241c16"/>
  <text x="930" y="122" text-anchor="middle" fill="#f3eadc" font-family="Verdana" font-size="13">Amazon Bedrock</text>
  <text x="930" y="144" text-anchor="middle" fill="#f3eadc" font-family="Verdana" font-size="11">Claude Sonnet · or desk router</text>

  <rect x="800" y="190" width="260" height="80" fill="#efe4d2" stroke="#d7c7b0"/>
  <text x="930" y="222" text-anchor="middle" font-family="Verdana" font-size="13">@tool functions</text>
  <text x="930" y="244" text-anchor="middle" font-family="Verdana" font-size="11">policy · triage · snapshot · digest</text>

  <path d="M620 260 V310" stroke="#241c16" stroke-width="2"/>

  <rect x="260" y="310" width="500" height="90" fill="#efe4d2" stroke="#d7c7b0"/>
  <text x="510" y="345" text-anchor="middle" font-family="Verdana" font-size="14">JSON memory · data/family.json</text>
  <text x="510" y="368" text-anchor="middle" font-family="Verdana" font-size="11" fill="#6b5748">policy · locks · requests · snapshots · pings · overrides · outbox</text>
  <text x="510" y="386" text-anchor="middle" font-family="Verdana" font-size="11" fill="#6b5748">survives restart · same family</text>

  <rect x="800" y="310" width="260" height="90" fill="#075e54"/>
  <text x="930" y="345" text-anchor="middle" fill="#f3eadc" font-family="Verdana" font-size="13">Sunday outbox</text>
  <text x="930" y="368" text-anchor="middle" fill="#f3eadc" font-family="Verdana" font-size="11">page + simulated WhatsApp</text>
  <text x="930" y="386" text-anchor="middle" fill="#f3eadc" font-family="Verdana" font-size="11">Red / Needs you / Green</text>

  <rect x="260" y="430" width="800" height="140" fill="#f3d4d0" stroke="#9b1c1c"/>
  <text x="280" y="462" font-family="Georgia" font-size="16" fill="#9b1c1c">Human gate</text>
  <text x="280" y="490" font-family="Verdana" font-size="13">No silent yes on social / purchase / new contact / new app.</text>
  <text x="280" y="512" font-family="Verdana" font-size="13">Child cannot approve themselves. Parent ignore → Sunday Red + Needs you.</text>
  <text x="280" y="534" font-family="Verdana" font-size="13">Checklist is claimed, not an API. Snapshot is a human paste, not a vendor feed.</text>
  <text x="280" y="556" font-family="Verdana" font-size="13">Optional later: AgentCore Runtime around the same orchestrator.</text>
</svg>
